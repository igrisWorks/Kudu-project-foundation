x-kudu-environment: &kudu-environment
  DATABASE_URL: "postgresql://${POSTGRES_USER:-kudu}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kudu}"
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  KUDU_AUTH_PASSWORD_HASH: ${KUDU_AUTH_PASSWORD_HASH:-}
  SESSION_SECRET: ${SESSION_SECRET:-}
  KUDU_COOKIE_SECURE: ${KUDU_COOKIE_SECURE:-true}
  KUDU_REST_TRUSTED_HOSTS: ${KUDU_REST_TRUSTED_HOSTS:-}

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kudu}
      POSTGRES_USER: ${POSTGRES_USER:-kudu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kudu-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app:
    image: kudu:${KUDU_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KUDU_VERSION: ${KUDU_VERSION:-0.1.0}
      secrets:
        - corporate-ca
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env.sources
        required: false
    environment:
      <<: *kudu-environment
      HOST: 0.0.0.0
      PORT: 3000
      KUDU_IMPORT_DIRECTORY: /imports
    volumes:
      - ${KUDU_IMPORT_HOST_DIRECTORY:-./imports}:/imports:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: kudu:${KUDU_VERSION:-0.1.0}
    command: ["node", "backend/dist/migrate.js"]
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      <<: *kudu-environment
    depends_on:
      db:
        condition: service_healthy

volumes:
  kudu-postgres:

secrets:
  corporate-ca:
    environment: KUDU_DOCKER_CA_CERT

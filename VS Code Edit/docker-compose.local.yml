services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KUDU_VERSION: ${KUDU_VERSION:-0.1.0}
      secrets:
        - corporate-ca
    image: kuduns-local:${KUDU_VERSION:-0.1.0}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      KUDU_LOCAL_MODE: "true"
      KUDU_LOCAL_DOCKER: "true"
      HOST: "127.0.0.1"
      PORT: "3001"
      KUDU_LOCAL_DOCKER_PORT: "3000"
      KUDU_DATA_DIR: /var/lib/kudu
      LOG_LEVEL: ${KUDU_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${KUDU_LOCAL_WEB_PORT:-3000}:3000"
    volumes:
      - kudu-local-settings:/var/lib/kudu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Keep the previous volume name: legacy settings are preserved, never deleted.
  kudu-local-settings:

secrets:
  corporate-ca:
    environment: KUDU_DOCKER_CA_CERT

openapi: 3.1.0
info:
  title: Kudu Registry and Events API
  version: 0.1.0
  summary: Asset and data-source registry API
  description: |
    Versioned API for Kudu's registries, event ingestion, source discovery, file imports, REST sync, and source event mappings.

    Data-source registration stores metadata only. Kudu reads a REST endpoint
    only after an operator explicitly requests discovery or sync. REST reads use
    bounded GET/JSON requests, active event mappings, and SSRF destination
    protections. Credential references are environment-variable names and are
    redacted from responses.

    Registry, event, import, mapping, and sync routes require the operator
    session cookie and X-Kudu-CSRF matching the same-site CSRF cookie. Health
    checks and authentication bootstrap routes remain public. Keep the
    application loopback-bound and use TLS for remote browser access.
servers:
  - url: /
security:
  - KuduSessionCookie: []
    KuduCsrfHeader: []
tags:
  - name: Health
  - name: Authentication
  - name: Assets
  - name: Data sources
  - name: Events
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      security: []
      responses:
        "200":
          description: The HTTP process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check API and database readiness
      security: []
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getAuthSession
      summary: Check the current operator session
      security: []
      responses:
        "200":
          description: Authentication configuration and current session state; no tokens are returned in JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an operator session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Login succeeded; session and CSRF cookies are set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: The login request is invalid.
        "401":
          description: The password is incorrect.
        "429":
          description: Login attempts are temporarily throttled.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current operator session
      description: Requires the authenticated session cookie and X-Kudu-CSRF header.
      responses:
        "204":
          description: Session revoked and cookies cleared.
        "401":
          description: The session is missing or expired.
        "403":
          description: The CSRF token is invalid.
  /api/v1/assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List and search assets
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          description: Defaults to active.
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: assetType
          in: query
          description: Filter by registered asset type.
          schema:
            $ref: "#/components/schemas/AssetType"
      responses:
        "200":
          description: A stable, key-ordered page of assets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Asset created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/assets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get an asset and its hierarchy
      responses:
        "200":
          description: Asset record with parent and children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Update, archive, or restore an asset
      description: |
        Send only the fields to change. Set parentAssetId to null to remove a
        parent, description to null to clear it, or archived to true/false to
        archive/restore. Delete is intentionally not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/data-sources:
    get:
      tags: [Data sources]
      operationId: listDataSources
      summary: List and search data sources
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sourceType
          in: query
          schema:
            $ref: "#/components/schemas/DataSourceType"
        - name: enabled
          in: query
          description: Defaults to all states.
          schema:
            type: string
            enum: [all, enabled, disabled]
            default: all
      responses:
        "200":
          description: A stable, display-name-ordered page of data sources.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Data sources]
      operationId: createDataSource
      summary: Register a data source
      description: Stores metadata only; this operation does not connect or ingest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceCreate"
      responses:
        "201":
          description: Data source metadata created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/data-sources/discover:
    post:
      tags: [Data sources]
      operationId: discoverDataSource
      summary: Inspect one REST, JSON, or CSV source on demand
      description: |
        Makes one bounded GET for a REST source or reads the configured file
        inside the import directory. It returns candidate record collections,
        redacted sample fields, mapping suggestions, and preview validation.
        It does not persist events, create assets, or activate a mapping.
        Choose a collection explicitly when more than one is found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceDiscoveryRequest"
      responses:
        "200":
          description: Candidate collections, inferred fields, suggestions, and a small sample preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDiscoveryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The source response or file exceeds its configured size limit.
        "502":
          description: The remote REST response could not be fetched or parsed.
  /api/v1/data-sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Data sources]
      operationId: getDataSource
      summary: Get data-source metadata
      responses:
        "200":
          description: Data-source metadata with redacted credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Data sources]
      operationId: updateDataSource
      summary: Update data-source metadata
      description: |
        Send only fields to change. When replacing a REST configuration,
        omitting credentialRef preserves the existing reference; setting it to
        null clears it. Changing sourceType requires a matching configuration.
        This operation never connects or starts ingestion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceUpdate"
      responses:
        "200":
          description: Updated data source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/data-sources/{id}/import:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Data sources]
      operationId: importDataSourceFile
      summary: Import the configured file for an enabled data source
      description: |
        Reads only the relativePath stored on the registered source, beneath
        KUDU_IMPORT_DIRECTORY. The request has no body and accepts no
        filesystem path. Only CSV and JSON file sources are supported.
        Identical repeated records use the normal event ingestion and
        source-scoped deduplication behavior. An active mapping is applied
        before ingestion; without one, the documented default field mapping
        remains in effect.
      responses:
        "200":
          description: Import completed; the result includes imported, skipped, and failed record counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: File size or record-count limit exceeded.
  /api/v1/data-sources/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Data sources]
      operationId: syncRestDataSource
      summary: Sync an enabled REST API source
      description: |
        Performs one explicit, read-only GET. Requires an active event mapping.
        The bounded JSON response is normalized and ingested through the
        existing event pipeline. DNS results and every redirect destination
        are checked against SSRF rules. Request failures are returned as
        requestSucceeded=false with sanitized errors; no run history is stored.
      responses:
        "200":
          description: Sync counts and sanitized request or record errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestSyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/data-sources/{id}/mappings:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Data sources]
      operationId: listDataSourceEventMappings
      summary: Inspect mapping versions for a supported source
      responses:
        "200":
          description: Mapping versions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceEventMappingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Data sources]
      operationId: createDataSourceEventMapping
      summary: Create the next mapping draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventMappingWrite"
      responses:
        "201":
          description: Mapping draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceEventMappingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Mapping definition exceeds the size limit.
  /api/v1/data-sources/{id}/mappings/{version}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      tags: [Data sources]
      operationId: updateDataSourceEventMapping
      summary: Update a mapping draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventMappingWrite"
      responses:
        "200":
          description: Updated draft; prior validation is cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceEventMappingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Mapping definition exceeds the size limit.
  /api/v1/data-sources/{id}/mappings/{version}/validate:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Data sources]
      operationId: validateDataSourceEventMapping
      summary: Validate a mapping draft
      description: Validates the definition structure and source-field path syntax; individual record values are checked during file import or REST sync.
      responses:
        "200":
          description: Validation result with errors, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMappingValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/data-sources/{id}/mappings/{version}/activate:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Data sources]
      operationId: activateDataSourceEventMapping
      summary: Activate a validated mapping draft
      responses:
        "200":
          description: Activated mapping; the previous active version is retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceEventMappingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List stored events and filter by provenance
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: assetId
          in: query
          schema:
            type: string
            format: uuid
        - name: sourceKey
          in: query
          description: Exact, case-insensitive registered source key.
          schema:
            $ref: "#/components/schemas/DataSourceKey"
        - name: assetKey
          in: query
          description: Exact, case-insensitive registered asset key.
          schema:
            $ref: "#/components/schemas/AssetKey"
        - name: eventType
          in: query
          schema:
            type: string
            maxLength: 120
        - name: from
          in: query
          description: Inclusive lower bound for occurrence time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive upper bound for occurrence time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Event metadata ordered by occurrence time descending; payloads are omitted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/EventListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Events]
      operationId: ingestEvent
      summary: Persist an industrial event
      description: |
        Occurrence timestamps must be RFC 3339 with an explicit timezone and are
        stored as UTC instants. Unknown payload fields are preserved. A
        deduplication key is unique within its source: an identical retry
        returns the original event with duplicate=true; reusing the key with
        different content returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: New event persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
        "200":
          description: Identical retry returned the existing event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event and its full payload
      responses:
        "200":
          description: Event, payload, and source provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    KuduSessionCookie:
      type: apiKey
      in: cookie
      name: kudu_session
      description: Opaque 8-hour HttpOnly SameSite session cookie.
    KuduCsrfHeader:
      type: apiKey
      in: header
      name: X-Kudu-CSRF
      description: Must match the same-site kudu_csrf cookie on every protected API request.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: search
      in: query
      description: Literal, case-insensitive match on key and display/name fields; maximum 120 characters.
      schema:
        type: string
        maxLength: 120
    Page:
      name: page
      in: query
      description: One-based page number; defaults to 1.
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Results per page; defaults to 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Invalid request or field validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate key or referenced record conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Database is not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
  schemas:
    AuthLoginInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AuthSession:
      type: object
      required: [configured, authenticated]
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [status, database, checkedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, unavailable]
        checkedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    Page:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    AssetType:
      type: string
      enum: [machine, production_line, plc, camera, sensor, other]
    AssetStatus:
      type: string
      enum: [active, archived]
    AssetKey:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
    ExternalIdentifier:
      type: object
      additionalProperties: false
      required: [sourceKey, externalId]
      properties:
        sourceKey:
          $ref: "#/components/schemas/AssetKey"
        externalId:
          type: string
          minLength: 1
          maxLength: 256
    AssetParent:
      type: object
      required: [id, assetKey, name]
      properties:
        id:
          type: string
          format: uuid
        assetKey:
          $ref: "#/components/schemas/AssetKey"
        name:
          type: string
    AssetChild:
      type: object
      required: [id, assetKey, name, assetType]
      properties:
        id:
          type: string
          format: uuid
        assetKey:
          $ref: "#/components/schemas/AssetKey"
        name:
          type: string
        assetType:
          $ref: "#/components/schemas/AssetType"
    Asset:
      type: object
      required:
        - id
        - assetKey
        - name
        - assetType
        - description
        - parentAssetId
        - parentAsset
        - externalIdentifiers
        - status
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        assetKey:
          $ref: "#/components/schemas/AssetKey"
        name:
          type: string
          maxLength: 160
        assetType:
          $ref: "#/components/schemas/AssetType"
        description:
          type: [string, "null"]
          maxLength: 2000
        parentAssetId:
          type: [string, "null"]
          format: uuid
        parentAsset:
          oneOf:
            - $ref: "#/components/schemas/AssetParent"
            - type: "null"
        externalIdentifiers:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalIdentifier"
        status:
          $ref: "#/components/schemas/AssetStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, "null"]
          format: date-time
    AssetDetail:
      allOf:
        - $ref: "#/components/schemas/Asset"
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/AssetChild"
    AssetCreate:
      type: object
      additionalProperties: false
      required: [assetKey, name, assetType]
      properties:
        assetKey:
          $ref: "#/components/schemas/AssetKey"
        name:
          type: string
          minLength: 1
          maxLength: 160
        assetType:
          $ref: "#/components/schemas/AssetType"
        description:
          type: [string, "null"]
          maxLength: 2000
        parentAssetId:
          type: [string, "null"]
          format: uuid
        externalIdentifiers:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalIdentifier"
    AssetUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        assetKey:
          $ref: "#/components/schemas/AssetKey"
        name:
          type: string
          minLength: 1
          maxLength: 160
        assetType:
          $ref: "#/components/schemas/AssetType"
        description:
          type: [string, "null"]
          maxLength: 2000
        parentAssetId:
          type: [string, "null"]
          format: uuid
        externalIdentifiers:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalIdentifier"
        archived:
          type: boolean
    DataSourceType:
      type: string
      enum: [rest_api, json_file, csv_file, manual]
    ConnectorStatus:
      type: string
      enum: [not_implemented, connected, error, unsupported]
    DataSourceKey:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
    DataSourceConfigurationInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, baseUrl]
          properties:
            kind:
              const: rest_api
            baseUrl:
              type: string
              format: uri
              description: HTTP(S) URL without credentials, query parameters, or fragments.
            endpointPath:
              type: string
              minLength: 1
              maxLength: 512
              description: Relative path appended to the base URL path.
            method:
              type: string
              enum: [GET]
              default: GET
            authMode:
              type: string
              enum: [none, bearer]
              default: none
            credentialRef:
              type: [string, "null"]
              pattern: "^env:KUDU_SOURCE_[A-Z0-9_]{1,80}$"
              description: Environment-variable reference only. Used for Authorization: Bearer when authMode is bearer.
            timeoutMs:
              type: integer
              minimum: 500
              maximum: 30000
              default: 10000
            maxResponseBytes:
              type: integer
              minimum: 1024
              maximum: 5242880
              default: 1048576
            maxRecords:
              type: integer
              minimum: 1
              maximum: 1000
              default: 500
            responseFormat:
              type: string
              enum: [json]
              default: json
            recordsPath:
              type: string
              maxLength: 256
              description: Dot path to the records array; blank means a top-level array.
        - type: object
          additionalProperties: false
          required: [kind, relativePath]
          properties:
            kind:
              const: json_file
            relativePath:
              $ref: "#/components/schemas/RelativePath"
            recordsPath:
              type: string
              maxLength: 256
              description: Dot path to the record array; blank means a top-level array.
        - type: object
          additionalProperties: false
          required: [kind, relativePath]
          properties:
            kind:
              const: csv_file
            relativePath:
              $ref: "#/components/schemas/RelativePath"
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              const: manual
    RelativePath:
      type: string
      minLength: 1
      maxLength: 500
      description: Relative to a future configured storage root; traversal segments are rejected.
      pattern: "^(?!/)(?!.*\\\\)(?!.*(?:^|/)\\.\\.?(/|$)).+$"
    DataSourceConfigurationMetadata:
      oneOf:
        - type: object
          required: [kind, baseUrl, credentialConfigured]
          properties:
            kind:
              const: rest_api
            baseUrl:
              type: string
              format: uri
            credentialConfigured:
              type: boolean
              description: Only indicates whether a reference exists; the reference and secret are never returned.
            endpointPath:
              type: string
            method:
              type: string
              enum: [GET]
            authMode:
              type: string
              enum: [none, bearer]
            timeoutMs:
              type: integer
            maxResponseBytes:
              type: integer
            maxRecords:
              type: integer
            responseFormat:
              type: string
              enum: [json]
            recordsPath:
              type: string
        - type: object
          required: [kind, relativePath]
          properties:
            kind:
              const: json_file
            relativePath:
              $ref: "#/components/schemas/RelativePath"
            recordsPath:
              type: string
              maxLength: 256
        - type: object
          required: [kind, relativePath]
          properties:
            kind:
              const: csv_file
            relativePath:
              $ref: "#/components/schemas/RelativePath"
        - type: object
          required: [kind, referenceOnly]
          properties:
            kind:
              const: manual
            referenceOnly:
              const: true
    DataSource:
      type: object
      required:
        - id
        - sourceKey
        - displayName
        - sourceType
        - description
        - configuration
        - enabled
        - connectionStatus
        - ingestionStatus
        - lastSuccessfulSyncAt
        - lastErrorSummary
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sourceKey:
          $ref: "#/components/schemas/DataSourceKey"
        displayName:
          type: string
          maxLength: 160
        sourceType:
          $ref: "#/components/schemas/DataSourceType"
        description:
          type: [string, "null"]
          maxLength: 2000
        configuration:
          $ref: "#/components/schemas/DataSourceConfigurationMetadata"
        enabled:
          type: boolean
        connectionStatus:
          $ref: "#/components/schemas/ConnectorStatus"
        ingestionStatus:
          $ref: "#/components/schemas/ConnectorStatus"
        lastSuccessfulSyncAt:
          type: [string, "null"]
          format: date-time
        lastErrorSummary:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataSourceCreate:
      type: object
      additionalProperties: false
      required: [sourceKey, displayName, sourceType, configuration]
      properties:
        sourceKey:
          $ref: "#/components/schemas/DataSourceKey"
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        sourceType:
          $ref: "#/components/schemas/DataSourceType"
        description:
          type: [string, "null"]
          maxLength: 2000
        configuration:
          $ref: "#/components/schemas/DataSourceConfigurationInput"
        enabled:
          type: boolean
    DataSourceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sourceKey:
          $ref: "#/components/schemas/DataSourceKey"
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        sourceType:
          $ref: "#/components/schemas/DataSourceType"
        description:
          type: [string, "null"]
          maxLength: 2000
        configuration:
          $ref: "#/components/schemas/DataSourceConfigurationInput"
        enabled:
          type: boolean
    DataSourceDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [sourceType, configuration]
      properties:
        sourceType:
          type: string
          enum: [rest_api, json_file, csv_file]
        configuration:
          $ref: "#/components/schemas/DataSourceConfigurationInput"
        recordPath:
          type: string
          maxLength: 256
          description: Select one collection path returned by an earlier discovery response.
    DataSourceDiscoveryResult:
      type: object
      required: [sourceType, recordPaths, selectedRecordPath, fields, suggestions, preview, warnings]
      properties:
        sourceType:
          type: string
          enum: [rest_api, json_file, csv_file]
        recordPaths:
          type: array
          items:
            type: object
            required: [path, recordCount, supported]
            properties:
              path: { type: string }
              recordCount: { type: integer, minimum: 0 }
              supported: { type: boolean }
        selectedRecordPath:
          type: [string, "null"]
        fields:
          type: array
          items:
            type: object
            required: [path, valueType, examples]
            properties:
              path: { type: string }
              valueType:
                type: string
                enum: [string, number, boolean, datetime, object, array, mixed, unknown]
              examples:
                type: array
                items: { type: string }
        suggestions:
          type: array
          items:
            type: object
            required: [target, sourcePath, confidence, confidenceScore, required, ambiguous, alternatives, examples, note]
            properties:
              target:
                type: string
                enum: [eventType, occurredAt, sourceRecordId, assetKey, message, severity, errorCode]
              sourcePath: { type: [string, "null"] }
              confidence:
                type: string
                enum: [high, medium, low]
              confidenceScore: { type: number, minimum: 0, maximum: 1 }
              required: { type: boolean }
              ambiguous: { type: boolean }
              alternatives:
                type: array
                items: { type: string }
              examples:
                type: array
                items: { type: string }
              note: { type: string }
        preview:
          type: array
          items:
            type: object
            required: [recordNumber, state, issues, values, normalized]
            properties:
              recordNumber: { type: integer, minimum: 1 }
              state:
                type: string
                enum: [valid, warning, rejected]
              issues:
                type: array
                items: { type: string }
              values:
                type: object
                additionalProperties: { type: string }
              normalized:
                type: object
                additionalProperties: { type: string }
        warnings:
          type: array
          items: { type: string }
    JsonValue:
      oneOf:
        - type: [string, number, boolean, "null"]
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    JsonObject:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    EventSourceReference:
      type: object
      required: [id, sourceKey, displayName]
      properties:
        id:
          type: string
          format: uuid
        sourceKey:
          $ref: "#/components/schemas/DataSourceKey"
        displayName:
          type: string
    EventAssetReference:
      type: object
      required: [id, assetKey, name]
      properties:
        id:
          type: string
          format: uuid
        assetKey:
          $ref: "#/components/schemas/AssetKey"
        name:
          type: string
    EventListItem:
      type: object
      required:
        - id
        - source
        - asset
        - sourceRecordId
        - eventType
        - occurredAt
        - ingestedAt
        - sourceTimestamp
        - deduplicationKey
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/EventSourceReference"
        asset:
          oneOf:
            - $ref: "#/components/schemas/EventAssetReference"
            - type: "null"
        sourceRecordId:
          type: [string, "null"]
        eventType:
          type: string
          maxLength: 120
        occurredAt:
          type: string
          format: date-time
          description: Normalized UTC occurrence instant.
        ingestedAt:
          type: string
          format: date-time
        sourceTimestamp:
          type: string
          description: Original source timestamp text retained for provenance.
        deduplicationKey:
          type: [string, "null"]
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventListItem"
        - type: object
          required: [payload, provenance]
          properties:
            payload:
              $ref: "#/components/schemas/JsonObject"
            provenance:
              $ref: "#/components/schemas/JsonObject"
    EventCreate:
      type: object
      additionalProperties: false
      required: [sourceId, eventType, occurredAt, payload]
      properties:
        sourceId:
          type: string
          format: uuid
        assetId:
          type: [string, "null"]
          format: uuid
        sourceRecordId:
          type: [string, "null"]
          maxLength: 256
        eventType:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$"
        occurredAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp with an explicit timezone.
        sourceTimestamp:
          type: [string, "null"]
          maxLength: 256
          description: Original timestamp text; defaults to occurredAt.
        deduplicationKey:
          type: [string, "null"]
          maxLength: 256
          description: Unique within the referenced data source when present.
        payload:
          $ref: "#/components/schemas/JsonObject"
        provenance:
          $ref: "#/components/schemas/JsonObject"
    IngestEventResponse:
      type: object
      required: [event, duplicate]
      properties:
        event:
          $ref: "#/components/schemas/EventDetail"
        duplicate:
          type: boolean
    FileImportRecordError:
      type: object
      required: [record, code, message]
      properties:
        record:
          type: integer
          minimum: 1
          description: CSV physical start line or one-based JSON array position.
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    RestSyncResult:
      type: object
      required: [sourceId, requestSucceeded, fetched, imported, duplicates, failed, errors, errorsTruncated]
      properties:
        sourceId:
          type: string
          format: uuid
        requestSucceeded:
          type: boolean
          description: False when the remote request or response could not be used.
        fetched:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/RestSyncRecordError"
        errorsTruncated:
          type: boolean
    RestSyncRecordError:
      type: object
      required: [record, code, message]
      properties:
        record:
          type: integer
          minimum: 0
          description: Zero denotes a request-level error.
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    FileImportResult:
      type: object
      required:
        - sourceId
        - format
        - records
        - imported
        - skipped
        - failed
        - errors
        - errorsTruncated
      properties:
        sourceId:
          type: string
          format: uuid
        format:
          type: string
          enum: [csv, json]
        records:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FileImportRecordError"
        errorsTruncated:
          type: boolean
    EventMappingWrite:
      type: object
      required: [definition]
      additionalProperties: false
      properties:
        definition:
          $ref: "#/components/schemas/EventMappingDefinition"
    EventMappingDefinition:
      type: object
      additionalProperties: true
      description: Draft definitions may be incomplete or contain unsupported properties; validation is required before activation.
      properties:
        eventType:
          type: string
          description: Source field path for the required event type.
        occurredAt:
          type: string
          description: Source field path for the required occurrence timestamp.
        sourceRecordId:
          type: string
          description: Optional source field path for the record ID.
        assetKey:
          type: string
          description: Optional source field path containing an exact registered asset key.
        payload:
          type: object
          additionalProperties:
            type: string
          description: Maps output payload names to source field paths.
    EventMappingValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    DataSourceEventMapping:
      type: object
      required: [id, sourceId, version, status, definition, validationErrors, validatedAt, activatedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, active, retired]
        definition:
          $ref: "#/components/schemas/EventMappingDefinition"
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/EventMappingValidationError"
        validatedAt:
          type: [string, "null"]
          format: date-time
        activatedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataSourceEventMappingsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceEventMapping"
    DataSourceEventMappingResponse:
      type: object
      required: [mapping]
      properties:
        mapping:
          $ref: "#/components/schemas/DataSourceEventMapping"
    EventMappingValidationResponse:
      allOf:
        - $ref: "#/components/schemas/DataSourceEventMappingResponse"
        - type: object
          required: [valid, errors]
          properties:
            valid:
              type: boolean
            errors:
              type: array
              items:
                $ref: "#/components/schemas/EventMappingValidationError"
